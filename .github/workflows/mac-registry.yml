name: Atualizar base MAC IEEE
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/atualizar-mac.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mac-registry.json
          git diff --cached --quiet || (git commit -m 'Atualiza base IEEE MAC' && git push)
